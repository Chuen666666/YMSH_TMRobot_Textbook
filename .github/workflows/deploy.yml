name: Deploy VitePress site to Pages

on:
  push:
    paths-ignore:
      - 'AGENTS.md'
      - 'README.md'
      - 'api-examples.md'
      - 'markdown-examples.md'
  pull_request:
    paths-ignore:
      - 'AGENTS.md'
      - 'README.md'
      - 'api-examples.md'
      - 'markdown-examples.md'

jobs:
  markdown-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint Markdown
        run: npm run lint:md

      - name: Validate name registry
        run: npm run validate:names

      - name: Check formatting
        run: npm run format:check

      - name: Build documentation
        run: npm run docs:build

  build-and-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: markdown-quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with Password
        run: npm run docs:build
        env:
          VITE_SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/.vitepress/dist
          cname: tm.chuen666666.com
